<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">코로나 염기서열 데이터 분석 기능 요약</title><desc id="desc">공개 코로나바이러스 염기서열을 수집하고 여러 서열을 정렬해 비교하는 과정을 구현한 학부 졸업 프로젝트입니다. 이 저장소는 수집·정렬 노트북을 중심으로 구성되어 있습니다. 서열 수집: GenBank 식별자 입력: NCBI에서 서열 조회 → 파일 저장·정렬: FASTA 파일로 저장: ClustalW2 다중 정렬 → 결과 확인: 정렬 파일 읽기: 가이드 트리 표시 설명용 도식입니다.</desc><rect width="1200" height="720" rx="24" fill="#EDF8F6"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" fill="#16464A"><rect x="52" y="47" width="7" height="25" rx="3" fill="#147D83"/><text x="74" y="67" font-size="21" font-weight="600" fill="#147D83">학부 졸업 프로젝트 · 수집과 정렬 노트북</text><text x="52" y="148" font-size="52" font-weight="800" letter-spacing="-2">코로나 염기서열 데이터 분석</text><text x="54" y="203" font-size="28" letter-spacing="-.6">공개 서열을 모아 정렬하고, 비교 가능한 결과로 정리합니다.</text><text x="54" y="257" font-size="17" letter-spacing="3" fill="#147D83">HOW IT WORKS</text><g transform="translate(52,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#CEE9E5"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#147D83">01</text><g transform="translate(60,51)"><rect x="78" y="3" width="83" height="99" rx="8" fill="none" stroke="#147D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 26H145 M95 44H138 M95 62H145 M95 80H125" fill="none" stroke="#147D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">서열 수집</text><text x="28" y="248" font-size="23">GenBank 식별자 입력</text><text x="28" y="281" font-size="23" fill="#147D83">NCBI에서 서열 조회</text></g><g transform="translate(422,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#CEE9E5"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#147D83">02</text><g transform="translate(60,51)"><rect x="32" y="0" width="20" height="17" rx="4" fill="#147D83" opacity="0.25"/><rect x="58" y="0" width="20" height="17" rx="4" fill="#147D83" opacity="0.5"/><rect x="84" y="0" width="20" height="17" rx="4" fill="#147D83" opacity="0.75"/><rect x="110" y="0" width="20" height="17" rx="4" fill="#147D83" opacity="1"/><rect x="136" y="0" width="20" height="17" rx="4" fill="#147D83" opacity="0.25"/><rect x="162" y="0" width="20" height="17" rx="4" fill="#147D83" opacity="0.5"/><rect x="188" y="0" width="20" height="17" rx="4" fill="#147D83" opacity="0.75"/><rect x="32" y="25" width="20" height="17" rx="4" fill="#147D83" opacity="0.5"/><rect x="58" y="25" width="20" height="17" rx="4" fill="#147D83" opacity="0.75"/><rect x="84" y="25" width="20" height="17" rx="4" fill="#147D83" opacity="1"/><rect x="110" y="25" width="20" height="17" rx="4" fill="#147D83" opacity="0.25"/><rect x="136" y="25" width="20" height="17" rx="4" fill="#147D83" opacity="0.5"/><rect x="162" y="25" width="20" height="17" rx="4" fill="#147D83" opacity="0.75"/><rect x="188" y="25" width="20" height="17" rx="4" fill="#147D83" opacity="1"/><rect x="32" y="50" width="20" height="17" rx="4" fill="#147D83" opacity="0.75"/><rect x="58" y="50" width="20" height="17" rx="4" fill="#147D83" opacity="1"/><rect x="84" y="50" width="20" height="17" rx="4" fill="#147D83" opacity="0.25"/><rect x="110" y="50" width="20" height="17" rx="4" fill="#147D83" opacity="0.5"/><rect x="136" y="50" width="20" height="17" rx="4" fill="#147D83" opacity="0.75"/><rect x="162" y="50" width="20" height="17" rx="4" fill="#147D83" opacity="1"/><rect x="188" y="50" width="20" height="17" rx="4" fill="#147D83" opacity="0.25"/><rect x="32" y="75" width="20" height="17" rx="4" fill="#147D83" opacity="1"/><rect x="58" y="75" width="20" height="17" rx="4" fill="#147D83" opacity="0.25"/><rect x="84" y="75" width="20" height="17" rx="4" fill="#147D83" opacity="0.5"/><rect x="110" y="75" width="20" height="17" rx="4" fill="#147D83" opacity="0.75"/><rect x="136" y="75" width="20" height="17" rx="4" fill="#147D83" opacity="1"/><rect x="162" y="75" width="20" height="17" rx="4" fill="#147D83" opacity="0.25"/><rect x="188" y="75" width="20" height="17" rx="4" fill="#147D83" opacity="0.5"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">파일 저장·정렬</text><text x="28" y="248" font-size="23">FASTA 파일로 저장</text><text x="28" y="281" font-size="23" fill="#147D83">ClustalW2 다중 정렬</text></g><g transform="translate(792,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#CEE9E5"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#147D83">03</text><g transform="translate(60,51)"><path d="M41 52H83V19H142 M83 52V86H142 M142 19V5H187 M142 19V36H187 M142 86V68H187 M142 86V102H187" fill="none" stroke="#147D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="191" cy="5" r="5" fill="#147D83"/><circle cx="191" cy="36" r="5" fill="#147D83"/><circle cx="191" cy="68" r="5" fill="#147D83"/><circle cx="191" cy="102" r="5" fill="#147D83"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">결과 확인</text><text x="28" y="248" font-size="23">정렬 파일 읽기</text><text x="28" y="281" font-size="23" fill="#147D83">가이드 트리 표시</text></g><line x1="54" y1="629" x2="1146" y2="629" stroke="#147D83" opacity=".2"/><text x="54" y="668" font-size="20" fill="#147D83">분석 과정의 설명 그림 · 실제 분석 결과나 의학적 판단을 나타내지 않음</text><text x="1145" y="701" text-anchor="end" font-size="12" letter-spacing="1.4" opacity=".65">FEATURE OVERVIEW · NOT A LIVE SCREENSHOT</text></g></svg>